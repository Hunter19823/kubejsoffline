import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id "dev.architectury.loom" version "${architectury_loom_version}" apply false
    id "architectury-plugin" version "${architectury_plugin_version}"
    id "me.shedaniel.unified-publishing" version "${unified_publishing_version}" apply false
    id 'com.github.johnrengelman.shadow' version "${shadowjar_version}" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group
}

subprojects {
    apply plugin: "java"
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    ext.ENV = System.getenv()


    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_base_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven {
            // Shedaniel's maven (Architectury API)
            url = "https://maven.architectury.dev"
            content {
                includeGroup "me.shedaniel"
            }
        }

        maven {
            url "https://maven.latvian.dev/releases"
            content {
                includeGroup "dev.latvian.mods"
                includeGroup "dev.latvian.apps"
            }
        }

        maven {
            url 'https://jitpack.io'
            content {
                includeGroup "com.github.rtyley"
            }
        }

        maven {
            url = uri("https://maven.pkg.github.com/Hunter19823/kubejsoffline-core")
            credentials {
                username = System.getenv("PACKAGE_ACTOR")
                password = System.getenv("PACKAGE_TOKEN")
            }
        }

        mavenLocal()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
        it.options.compilerArgs << '-parameters'
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }


    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }


    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // The following line declares the mojmap mappings, you may use other mappings as well
        mappings loom.officialMojangMappings()
        // The following line declares the yarn mappings you may select this one as well.
        // mappings "net.fabricmc:yarn:1.16.5+build.10:v2"
        // Loom (Fabric / Quilt / Architectury )
        implementation group: "pie.ilikepiefoo", name: "kubejsoffline-core", version: "${project.core_version}"
        implementation group: "org.reflections", name: "reflections", version: "${project.reflections_version}"
    }

    tasks.withType(ProcessResources).tap {
        configureEach {
            processResources {
                outputs.upToDateWhen { false }

                def p1 = 'git rev-parse HEAD'.execute()
                p1.waitFor()
                project.setProperty("github_commit_hash", p1.text.trim())
                filesMatching([rootProject.neoforge_config, "html/js/constants.js"]) {
                    expand project.properties
                }
            }
        }
    }
}

class MoveDocumentationFiles extends DefaultTask {
    // Store references to the forge and fabric html file directories
    private final File neoForgeHtmlDir = new File("${project.projectDir}/neoforge/run/kubejs/documentation/index.html")

    // Store references to the forge and fabric output directories
    private final File neoforgeOutputDir = new File("${project.projectDir}/docs/${project.minecraft_version}/forge/index.html")

    @TaskAction
    def moveFiles() {
        // Create the forge output directories if they do not exist
        if (!neoforgeOutputDir.exists()) {
            neoforgeOutputDir.mkdirs()
        }
        // If the forge file exists, move it to the forge output directory
        if (neoForgeHtmlDir.exists()) {
            Files.move(neoForgeHtmlDir.toPath(), neoforgeOutputDir.toPath(), StandardCopyOption.REPLACE_EXISTING)
            println "Moved Forge documentation file to ${neoforgeOutputDir}"
        } else {
            println "Forge documentation file does not exist!"
        }
    }

    @TaskAction
    def greet() {
        moveFiles()
    }
}

tasks.register('updateDocumentation', MoveDocumentationFiles) {
    group = 'documentation'
    description = 'Moves the documentation files to the docs directory'
}
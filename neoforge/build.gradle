plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {

    shadowImplementation.extendsFrom implementation
    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
    mavenLocal()
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_version"

    api("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
//    interfaceInjectionData("dev.latvian.mods:kubejs-neoforge:$kubejs_version") // optional

    shadowBundle group: "org.reflections", name: "reflections", version: "${project.reflections_version}"
    shadowBundle group: "pie.ilikepiefoo", name: "kubejsoffline-core", version: "${project.core_version}"
}


shadowJar {
    exclude "javax/"
    exclude "org/slf4j/"
    exclude "org/opentest4j/"
    exclude "org/junit/"
    exclude "org/apiguardian/"
    exclude "javassist/tools/"
    exclude "com/google/gson/"
    exclude "org/apache/logging/"
    exclude "META-INF/maven/com.google.code.findbugs/"
    exclude "META-INF/maven/com.google.code.gson/"
    exclude "META-INF/maven/org.apache.logging.log4j/"
    exclude "META-INF/maven/org.slf4j/"
    exclude "META-INF/maven/org.javassist/"
    exclude "META-INF/maven/org.reflections/"
    exclude "META-INF/org/"
    exclude "META-INF/services/"
//    exclude "META-INF/versions/"
    exclude "META-INF/DEPENDENCIES"
    exclude "META-INF/junit*"
    exclude "META-INF/LICENSE*"
    exclude "META-INF/NOTICE"
    exclude "Log4j*"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    relocate "org.reflections", "${project.group}.kubejsoffline.reflections"
    relocate "javassist", "${project.group}.kubejsoffline.javassist"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
